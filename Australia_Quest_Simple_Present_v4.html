<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Australia Quest – Simple Present</title><style>*{box-sizing:border-box}body{margin:0;color:#173047;font-family:system-ui,Arial;background:linear-gradient(150deg,#ffe5b3,#fdf6e9 40%,#cbe9ed)}.wrap{max-width:950px;margin:auto;padding:22px}.hero{background:linear-gradient(110deg,#b83e27,#e98c42);color:white;border-radius:25px;padding:26px;box-shadow:0 10px 30px #8445}.hero h1{margin:4px 0;font-size:clamp(30px,6vw,54px)}.hero p{margin:5px}.animals{font-size:52px;letter-spacing:12px}.card{background:#fffdf8;border:2px solid #f2d8a8;border-radius:20px;padding:20px;margin:18px 0;box-shadow:0 4px 10px #60491b12}.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:13px;margin-top:24px}.tile{cursor:pointer;text-align:left;background:white;border:2px solid #e6b87d;border-radius:18px;padding:18px;color:#173047;font:inherit}.tile strong{display:block;font-size:19px}.tile small{display:block;margin-top:7px}.tile:hover{border-color:#c55230}.btn{background:#175a70;color:white;border:0;border-radius:12px;padding:12px 18px;cursor:pointer;font-weight:700;margin:6px 6px 6px 0}.btn.secondary{background:#c55230}.btn.ghost{background:#edf4f3;color:#173047}.options{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.option{border:2px solid #aac9ca;background:white;border-radius:12px;padding:12px 16px;cursor:pointer;font-size:17px}.option.good{background:#d7f3df;border-color:#239653}.option.bad{background:#ffe0df;border-color:#d34b42}.option:disabled{cursor:default}.question{padding:16px 0;border-bottom:1px solid #eee}.question h3{margin:5px 0}.feedback{font-weight:650;margin:8px 0}.rule{border-left:7px solid #d16c3e}.examples{background:#f0f7f5;padding:12px;border-radius:12px;line-height:1.8}.translation{background:#fff1d5;padding:12px;border-radius:10px}.note{border-left:7px solid #3196a2}.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.chip{background:#fff0d3;border:2px solid #e3ac5b;border-radius:10px;padding:10px;cursor:pointer}.answer{min-height:52px;background:#f2f7f6;border:2px dashed #78a7a8;border-radius:10px;padding:8px}.muted{color:#5c7280}.tag{font-size:13px;font-weight:bold;color:#b54c2e;letter-spacing:1px}</style></head><body><main class="wrap" id="app"></main><script>const D={"stations":[["Welcome to Australia","Positive statements · he/she/it · signal words",[["rule","Signal words: always, usually, often, sometimes, never, every day, every week, on Mondays, once a week. Frequency adverbs normally come BEFORE the main verb but AFTER am/is/are.","Signalwörter: always (immer), usually (normalerweise), often (oft), sometimes (manchmal), never (nie), every day (jeden Tag), every week (jede Woche), on Mondays (montags), once a week (einmal pro Woche). Häufigkeitsadverbien stehen normalerweise VOR dem Vollverb, aber NACH am/is/are.","Koalas often sleep during the day.|Sydney is usually busy.|We go swimming every week."],["match","Match the signal words with their German meanings.",[["always","immer"],["usually","normalerweise"],["often","oft"],["sometimes","manchmal"],["never","nie"],["every day","jeden Tag"],["every week","jede Woche"],["on Mondays","montags"],["once a week","einmal pro Woche"]]],["rule","We use the simple present for facts, habits and things that happen regularly.","Wir verwenden das Simple Present für Tatsachen, Gewohnheiten und Dinge, die regelmäßig passieren.","I live in Australia. → Mia lives in Australia.|We play football. → Tom plays football.|They like surfing. → Lucy likes surfing.|I visit Sydney. → Mia visits Sydney.|We work at a wildlife park. → The ranger works at a wildlife park.|We watch kangaroos. → Tom watches kangaroos.|They study English. → Lucy studies English.|I have a map. → She has a map."],["rule","HE / SHE / IT: Add -s to the verb. With I / you / we / they, use the base verb. Spelling: go → goes; watch → watches; study → studies; have → has.","HE / SHE / IT: Hänge -s an das Verb an. Bei I / you / we / they verwendest du die Grundform des Verbs. Schreibweisen: go → goes; watch → watches; study → studies; have → has.","I live in Australia. → Mia lives in Australia.|We watch kangaroos. → Tom watches kangaroos.|They study English. → Lucy studies English.|I have a map. → She has a map."],["choice","Choose the correct verb.",[["Kangaroos ___ in Australia.","live",["live","lives","living"],"Plural: kangaroos → live."],["A koala ___ eucalyptus leaves.","eats",["eat","eats","eating"],"He/she/it: add -s."],["Mia ___ surfing.","likes",["like","likes","liking"],"Mia = she → likes."],["Tom ___ football at school.","plays",["play","plays","playing"],"Tom = he → plays."],["The ranger ___ at a wildlife park.","works",["work","works","working"],"The ranger = he/she → works."],["Lucy ___ her grandma on Sundays.","visits",["visit","visits","visiting"],"Lucy = she → visits."],["Mia ___ to school every day.","goes",["go","goes","going"],"go → goes."],["The ranger ___ the animals.","watches",["watch","watches","watchs"],"watch → watches."],["Lucy ___ English at school.","studies",["study","studies","studys"],"consonant + y → ies."],["Jack ___ a surfboard.","has",["have","has","haves"],"have → has."]]],["choice","Signal words and word order.",[["Koalas ___ sleep in trees.","often",["often","yesterday","last year"],"often = oft."],["Sydney is ___ busy.","usually",["usually","last night","ago"],"After is: usually."],["We go to the beach ___.","every week",["every week","yesterday","two days ago"],"every week = jede Woche."],["Which word is NOT a typical simple present signal word?","yesterday",["usually","always","yesterday"],"Yesterday points to the past."]]],["note","<b>Copy and complete in GoodNotes:</b><br><b>1. When do we use the Simple Present?</b><br>We use the simple present for ______, ______ and ______.<br><b>2. Signal words</b><br>always = ______ · usually = ______ · often = ______ · sometimes = ______ · never = ______ · every day = ______.<br><b>3. The he/she/it rule</b><br>I / you / we / they → ______ form.<br>He / she / it → verb + ______.<br><b>Special spelling rules (part of rule 3):</b><br>go → ______ · watch → ______ · study → ______ · have → ______.<br><b>4. Word order with frequency adverbs</b><br>koalas / often / sleep → ____________________.<br>is / usually / Sydney / busy → ____________________."]]],["Life in the Outback","Negatives · don't / doesn't · am not / isn't / aren't",[["rule","Use don't + base verb with I/you/we/they. Use doesn't + base verb with he/she/it. After doesn't, NEVER add -s to the main verb.","Verwende don’t + Grundform bei I/you/we/they. Verwende doesn’t + Grundform bei he/she/it. Nach doesn’t darfst du NIEMALS ein -s an das Vollverb anhängen.","Kangaroos don't fly.|A koala doesn't eat meat.|Mia doesn't live in Perth."],["choice","Choose the correct negative.",[["A kangaroo ___ fly.","doesn't",["don't","doesn't","isn't"],"A kangaroo = it → doesn't."],["Koalas ___ eat fish.","don't",["don't","doesn't","aren't"],"Koalas = they → don't."],["Mia doesn't ___ in Sydney.","live",["lives","live","living"],"After doesn't use base form."],["We ___ travel to Australia every year.","don't",["don't","doesn't","isn't"],"We → don't."],["The ranger ___ work at night.","doesn't",["don't","doesn't","aren't"],"The ranger = he/she → doesn't."]]],["rule","For BE, use am not, isn't, aren't. Do NOT use don't or doesn't with am/is/are.","Bei BE verwendest du am not, isn’t und aren’t. Verwende NICHT don’t oder doesn’t mit am/is/are.","I am not in Sydney.|A koala isn't a bear.|Kangaroos aren't birds."],["choice","Negatives with BE.",[["Sydney ___ in Europe.","isn't",["doesn't","isn't","aren't"],"Sydney is → isn't."],["Koalas ___ birds.","aren't",["don't","isn't","aren't"],"Koalas are → aren't."],["I ___ a tour guide.","am not",["don't","am not","isn't"],"I am → I am not."],["The beaches ___ empty.","aren't",["aren't","doesn't","isn't"],"Plural beaches → aren't."]]],["note","<b>Copy and complete in GoodNotes:</b><br>1. I / you / we / they + ______ + base verb.<br>2. He / she / it + ______ + base verb.<br>3. Complete: A koala ______ eat meat. · Kangaroos ______ fly.<br>4. After doesn't, the verb has ______ -s.<br>5. Negative BE forms: I ______ · he/she/it ______ · you/we/they ______.<br>6. Complete: Sydney ______ in Europe. · Koalas ______ birds."]]],["Discover Sydney","Do / does · am / is / are · short answers",[["rule","For questions with main verbs, start with DO or DOES. Use the base verb after does.","Bei Fragen mit Vollverben beginnst du mit DO oder DOES. Nach does verwendest du die Grundform des Verbs.","Do kangaroos jump? Yes, they do.|Does Mia live in Sydney? No, she doesn't."],["choice","DO or DOES?",[["___ koalas sleep in trees?","Do",["Do","Does","Are"],"Koalas = they → Do."],["___ a kangaroo jump?","Does",["Do","Does","Is"],"A kangaroo = it → Does."],["Does Tom ___ near Sydney?","live",["live","lives","living"],"After does: base form."],["___ you like surfing?","Do",["Do","Does","Are"],"You → Do."]]],["rule","With BE, put am/is/are BEFORE the person. Do NOT add do/does. Short answers repeat the auxiliary: Yes, she does. / No, she doesn't. / Yes, it is. / No, they aren't.","Bei BE stellst du am/is/are VOR die Person. Füge NICHT do/does hinzu. In Kurzantworten wiederholst du das Hilfsverb: Yes, she does. / No, she doesn’t. / Yes, it is. / No, they aren’t.","Is Sydney in Australia? Yes, it is.|Are koalas birds? No, they aren't.|Does Mia surf? Yes, she does."],["choice","Questions and short answers.",[["___ Sydney a big city?","Is",["Do","Does","Is"],"BE question → Is."],["___ kangaroos mammals?","Are",["Do","Are","Does"],"Kangaroos are → Are."],["Does Mia surf? Yes, she ___.","does",["is","does","do"],"Does → Yes, she does."],["Do they live in Perth? No, they ___.","don't",["doesn't","aren't","don't"],"Do → No, they don't."],["Is Sydney in Australia? Yes, it ___.","is",["does","is","are"],"Is → Yes, it is."],["Are koalas birds? No, they ___.","aren't",["don't","isn't","aren't"],"Are → No, they aren't."],["Are you a student? Yes, I ___.","am",["do","is","am"],"Are you → Yes, I am."]]],["pair","Match each question to the correct short answer. Tap a question, then tap its answer.",[["Do kangaroos jump?","Yes, they do."],["Does Mia surf?","Yes, she does."],["Does a koala fly?","No, it doesn’t."],["Do you like Australia?","Yes, I do."],["Is Sydney in Australia?","Yes, it is."],["Are koalas birds?","No, they aren’t."],["Is Tom a ranger?","No, he isn’t."],["Are the beaches beautiful?","Yes, they are."]]],["note","<b>Copy and complete in GoodNotes:</b><br>1. ______ + I/you/we/they + base verb?<br>2. ______ + he/she/it + base verb?<br>3. Complete: ______ Mia live in Sydney? · ______ koalas sleep in trees?<br>4. BE question: ______ Sydney in Australia? · ______ kangaroos mammals?<br>5. Short answers: Does Mia surf? Yes, she ______. / No, she ______.<br>6. Is Sydney in Australia? Yes, it ______. / No, it ______.<br>7. Are koalas birds? Yes, they ______. / No, they ______."]]],["Australian Adventures","Question words · do/does · am/is/are",[["rule","Question words: what (was), where (wo), when (wann), why (warum), who (wer), how (wie). Use a question word BEFORE do/does or am/is/are.","Fragewörter: what (was), where (wo), when (wann), why (warum), who (wer), how (wie). Verwende ein Fragewort VOR do/does oder am/is/are.","Where do kangaroos live?|What does a koala eat?|Where is Sydney?|Why are the beaches popular?"],["choice","Choose the question word.",[["___ do kangaroos live? – In Australia.","Where",["Where","When","Who"],"A place → where."],["___ does a koala eat? – Eucalyptus leaves.","What",["What","Why","When"],"A thing → what."],["___ is the Great Barrier Reef? – In Australia.","Where",["Who","Where","How"],"A place → where."],["___ do you go to school? – At eight o'clock.","When",["When","Where","Why"],"A time → when."],["___ is your teacher? – Mr Brown.","Who",["Who","When","How"],"A person → who."],["___ do you travel to school? – By bus.","How",["What","How","Who"],"A method → how."]]],["rule","Word order: Question word + do/does + person + base verb? OR question word + am/is/are + person?","Wortstellung: Fragewort + do/does + Person + Grundform des Verbs? ODER Fragewort + am/is/are + Person?","Where does Mia live?|When do you visit the beach?|Where is Uluru?|Why are koalas sleepy?"],["build","Build the question. Tap the word cards in the correct order.",[["Where","do","kangaroos","live","?"],["What","does","a koala","eat","?"],["Where","is","Sydney","?"],["Why","are","the beaches","popular","?"],["When","does","Mia","surf","?"]]],["note","<b>Copy and complete in GoodNotes:</b><br>1. what = ______ · where = ______ · when = ______ · why = ______ · who = ______ · how = ______.<br>2. Question word + ______ / ______ + person + base verb?<br>3. Question word + ______ / ______ / ______ + person?<br>4. Complete: ______ do kangaroos live? – In Australia.<br>5. Complete: ______ does a koala eat? – Leaves.<br>6. Complete: ______ is Sydney? – In Australia.<br>7. Write the full question: Mia lives in Sydney. → Where ____________________?"]]],["The Great Australia Challenge","All grammar mixed · final self-check",[["choice","FINAL MIX – Think carefully!",[["A koala ___ in a tree.","sleeps",["sleep","sleeps","sleeping"],"he/she/it + s."],["Mia ___ a surfboard.","has",["have","has","haves"],"have → has."],["Kangaroos ___ eat meat.","don't",["doesn't","don't","aren't"],"Plural → don't."],["A koala doesn't ___ fish.","eat",["eats","eat","eating"],"Base form after doesn't."],["Sydney ___ in Europe.","isn't",["doesn't","aren't","isn't"],"BE negative."],["___ koalas sleep a lot?","Do",["Does","Do","Are"],"Main verb: do."],["___ Sydney in Australia?","Is",["Does","Do","Is"],"BE: is."],["Does Mia surf? Yes, she ___.","does",["does","is","do"],"Short answer."],["Are koalas birds? No, they ___.","aren't",["don't","doesn't","aren't"],"BE short answer."],["___ does a koala eat? – Leaves.","What",["Why","Where","What"],"Ask for a thing."],["___ is Uluru? – In Australia.","Where",["When","Where","Who"],"Ask for a place."],["Which is a simple present signal word?","usually",["yesterday","last week","usually"],"Usually shows a habit."],["The ranger ___ the animals every day.","watches",["watch","watchs","watches"],"watch → watches."],["Mia is ___ happy at the beach.","often",["often","yesterday","ago"],"Frequency adverb after is."]]],["build","FINAL BUILD – Mixed questions.",[["Does","Mia","live","in Sydney","?"],["Are","koalas","mammals","?"],["Where","does","Tom","live","?"],["Why","are","kangaroos","fast","?"]]],["note","<b>GoodNotes final check – copy and complete:</b><br>1. A koala ______ (sleep) in a tree.<br>2. Mia ______ (not / eat) meat.<br>3. ______ kangaroos ______ (jump)?<br>4. ______ Sydney in Australia? – Yes, it ______.<br>5. ______ does a koala eat? – Leaves.<br>6. Complete a signal word: Koalas ______ sleep in trees.<br>7. Tick: □ he/she/it □ spelling □ signal words □ negatives □ do/does □ am/is/are □ short answers □ question words.<br>8. My next practice topic: ____________________."]]]],"games":[["Kangaroo Verb Jump",[["A koala ___ in a tree.","sleeps",["sleeps","sleep","sleeping"]],["Mia ___ surfing.","likes",["like","likes","liking"]],["Jack ___ a bike.","has",["have","has","haves"]],["A ranger ___ animals.","watches",["watchs","watches","watch"]],["Lucy ___ English.","studies",["studys","studies","study"]],["Tom ___ to school.","goes",["go","goes","gos"]],["Koalas ___ leaves.","eat",["eats","eat","eating"]],["We ___ Australia.","love",["loves","loving","love"]],["A kangaroo ___ fast.","jumps",["jump","jumps","jumping"]],["Sydney ___ busy.","is",["are","is","do"]]]],["Crocodile Negative Attack",[["Koalas ___ fly.","don't",["doesn't","aren't","don't"]],["A koala ___ eat meat.","doesn't",["don't","doesn't","isn't"]],["Sydney ___ in Europe.","isn't",["doesn't","isn't","aren't"]],["We ___ live in Perth.","don't",["don't","doesn't","aren't"]],["Kangaroos ___ birds.","aren't",["don't","isn't","aren't"]],["Mia ___ surf every day.","doesn't",["don't","isn't","doesn't"]],["I ___ a ranger.","am not",["don't","am not","isn't"]],["Tom ___ like snakes.","doesn't",["doesn't","don't","isn't"]],["The beaches ___ empty.","aren't",["isn't","aren't","don't"]],["They ___ eat fish.","don't",["doesn't","don't","aren't"]]]],["Sydney Question Race",[["___ Mia live in Sydney?","Does",["Does","Do","Is"]],["___ koalas sleep in trees?","Do",["Are","Does","Do"]],["___ Sydney in Australia?","Is",["Is","Does","Do"]],["___ kangaroos mammals?","Are",["Do","Does","Are"]],["Does Tom surf? Yes, he ___.","does",["is","does","do"]],["Do they swim? No, they ___.","don't",["aren't","doesn't","don't"]],["Is Mia happy? Yes, she ___.","is",["does","is","are"]],["Are they students? Yes, they ___.","are",["do","is","are"]],["Does a koala eat leaves? Yes, it ___.","does",["does","is","do"]],["Are koalas birds? No, they ___.","aren't",["don't","aren't","doesn't"]]]],["Outback Survival",[["___ do kangaroos live? – Australia.","Where",["What","Where","When"]],["___ does a koala eat? – Leaves.","What",["Where","What","Who"]],["___ is Sydney? – Australia.","Where",["Where","Who","How"]],["___ do you go to school? – At eight.","When",["Where","When","Why"]],["___ is your friend? – Mia.","Who",["Who","How","When"]],["___ do you travel? – By bus.","How",["Why","Who","How"]],["Where ___ Mia live?","does",["do","is","does"]],["Why ___ kangaroos fast?","are",["do","does","are"]],["A koala ___ sleep in water.","doesn't",["don't","doesn't","isn't"]],["Mia ___ visits the beach.","often",["yesterday","often","ago"]]]]]};let current=-1,score=0,answered=0,total=0,gameIndex=0,gameQs=[];const $=id=>document.getElementById(id);const esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');function readProgress(){try{return JSON.parse(localStorage.getItem('ausquest')||'{}')}catch(e){return {}}}function saveProgress(d){try{localStorage.setItem('ausquest',JSON.stringify(d))}catch(e){}}function menu(){current=-1;let done=readProgress();$('app').innerHTML=`<div class="hero"><div class="animals">🦘 🐨 🌞 🐊</div><div class="tag" style="color:#ffe2b7">ENGLISH GRAMMAR ADVENTURE</div><h1>AUSTRALIA QUEST</h1><p>THE SIMPLE PRESENT ADVENTURE</p></div><div class="card"><b>How to work:</b> Read the rule → practise → check your answers → write your GoodNotes summary. Complete stations 1–5. Bonus games 6–9 are optional. 🇩🇪 Use the German help button if you need it.</div><h2>📍 Learning stations</h2><div class="menu">${D.stations.map((s,i)=>`<button class="tile" onclick="station(${i})"><div style="font-size:35px">${['🦘','🐊','🏙️','🐨','🏆'][i]}</div><strong>${i+1}. ${esc(s[0])} ${done[i]?'✓':''}</strong><small>${esc(s[1])}</small></button>`).join('')}</div><h2>🎮 Bonus games</h2><div class="menu">${D.games.map((g,i)=>`<button class="tile" onclick="startGame(${i})"><div style="font-size:35px">${['🦘','🐊','🏄','🧭'][i]}</div><strong>${i+6}. ${esc(g[0])}</strong><small>10 quick rounds · Play again</small></button>`).join('')}</div>`}function station(i){current=i;score=0;answered=0;total=0;let s=D.stations[i];$('app').innerHTML=`<button class="btn ghost" onclick="menu()">← All stations</button><div class="hero"><div class="animals">${['🦘 🌿','🐊 🌵','🏙️ 🌊','🐨 🧭','🏆 🇦🇺'][i]}</div><h1>STATION ${i+1}</h1><h2>${esc(s[0])}</h2><p>${esc(s[1])}</p></div><div id="tasks"></div><div class="card" id="result"><b>Progress:</b> <span id="progress">0 / 0</span></div><button class="btn" onclick="finishStation()">Finish station ✓</button>`;let t=$('tasks');let ruleNumber=0;s[2].forEach((step,k)=>{if(step[0]==='rule'){let box=document.createElement('section');box.className='card rule';box.innerHTML=`<div class="tag">📖 RULE ${++ruleNumber}</div><p><b>${esc(step[1])}</b></p><div class="examples">${step[3].split('|').map(x=>'✓ '+esc(x)).join('<br>')}</div><button class="btn ghost" onclick="this.nextElementSibling.hidden=!this.nextElementSibling.hidden">🇩🇪 Erklärung auf Deutsch</button><div class="translation" hidden>${esc(step[2])}</div>`;t.appendChild(box)}else if(step[0]==='match'){let box=document.createElement('section');box.className='card';box.innerHTML='<h2>🧩 '+esc(step[1])+'</h2><p class="muted">Choose the correct German translation for each word.</p>';let translations=step[2].map(x=>x[1]);step[2].forEach((q,j)=>{total++;let p=document.createElement('div');p.className='question';let opts=[...translations].sort(()=>Math.random()-.5);p.innerHTML='<h3>'+(j+1)+'. '+esc(q[0])+'</h3><div class="options">'+opts.map(x=>'<button class="option">'+esc(x)+'</button>').join('')+'</div><div class="feedback"></div>';p.querySelectorAll('.option').forEach(b=>b.onclick=()=>{if(p.dataset.done)return;p.dataset.done='1';answered++;let ok=b.textContent===q[1];if(ok)score++;p.querySelectorAll('.option').forEach(z=>{z.disabled=true;if(z.textContent===q[1])z.classList.add('good')});if(!ok)b.classList.add('bad');p.querySelector('.feedback').textContent=ok?'✓ Correct!':'✗ '+q[0]+' = '+q[1];update()});box.appendChild(p)});t.appendChild(box)}else if(step[0]==='pair'){let box=document.createElement('section');box.className='card';box.innerHTML='<h2>🧩 '+esc(step[1])+'</h2><p class="muted">First tap a question on the left, then its matching short answer on the right. Works with touch on iPad.</p>';let rows=step[2],remaining=rows.map((r,i)=>i),selected=null;total+=rows.length;let area=document.createElement('div');box.appendChild(area);function renderPairs(){area.innerHTML='';let grid=document.createElement('div');grid.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:12px';let left=document.createElement('div'),right=document.createElement('div');let order=[...remaining].sort(()=>Math.random()-.5);remaining.forEach(i=>{let b=document.createElement('button');b.className='option';b.style.cssText='display:block;width:100%;margin:7px 0;text-align:left';b.textContent=rows[i][0];if(selected===i)b.style.borderColor='#d16c3e';b.onclick=()=>{selected=i;renderPairs()};left.appendChild(b)});order.forEach(i=>{let b=document.createElement('button');b.className='option';b.style.cssText='display:block;width:100%;margin:7px 0;text-align:left';b.textContent=rows[i][1];b.onclick=()=>{if(selected===null){msg.textContent='Choose a question first.';return}if(selected===i){score++;answered++;remaining=remaining.filter(x=>x!==i);msg.textContent='✓ Correct match!';selected=null;update();renderPairs()}else{msg.textContent='✗ Not quite. Try another answer.'}};right.appendChild(b)});grid.append(left,right);area.appendChild(grid);if(!remaining.length){area.innerHTML='<h3>🎉 All short answers matched!</h3>'}}let msg=document.createElement('div');msg.className='feedback';box.appendChild(msg);renderPairs();t.appendChild(box)}else if(step[0]==='choice'){let box=document.createElement('section');box.className='card';box.innerHTML=`<h2>✏️ ${esc(step[1])}</h2>`;step[2].forEach((q,j)=>{total++;let p=document.createElement('div');p.className='question';p.innerHTML=`<h3>${j+1}. ${esc(q[0])}</h3><div class="options">${q[2].map(x=>`<button class="option">${esc(x)}</button>`).join('')}</div><div class="feedback" aria-live="polite"></div>`;p.querySelectorAll('.option').forEach(b=>b.onclick=()=>{if(p.dataset.done)return;p.dataset.done='1';answered++;let ok=b.textContent===q[1];if(ok)score++;p.querySelectorAll('.option').forEach(z=>{z.disabled=true;if(z.textContent===q[1])z.classList.add('good')});if(!ok)b.classList.add('bad');p.querySelector('.feedback').textContent=(ok?'✓ Correct!':'✗ Correct answer: '+q[1]+'.')+' '+q[3];update()});box.appendChild(p)});t.appendChild(box)}else if(step[0]==='build'){let box=document.createElement('section');box.className='card';box.innerHTML=`<h2>🧩 ${esc(step[1])}</h2>`;step[2].forEach((words,j)=>{total++;let p=document.createElement('div');p.className='question';p.innerHTML=`<h3>${j+1}. Build a question</h3><div class="answer"></div><div class="chips"></div><button class="btn secondary">Check</button><button class="btn ghost">Reset</button><div class="feedback"></div>`;let selected=[];let shuffled=[...words].sort(()=>Math.random()-.5);let bank=p.querySelector('.chips'),answer=p.querySelector('.answer');function render(){bank.innerHTML='';answer.innerHTML='';shuffled.forEach((w,n)=>{if(selected.includes(n))return;let b=document.createElement('button');b.className='chip';b.textContent=w;b.onclick=()=>{selected.push(n);render()};bank.appendChild(b)});selected.forEach(n=>{let b=document.createElement('button');b.className='chip';b.textContent=shuffled[n];b.onclick=()=>{selected=selected.filter(x=>x!==n);render()};answer.appendChild(b)})}render();p.querySelectorAll('.btn')[0].onclick=()=>{if(p.dataset.done)return;let got=selected.map(n=>shuffled[n]).join(' ');let expected=words.join(' ');if(selected.length!==words.length){p.querySelector('.feedback').textContent='Choose all word cards first.';return}p.dataset.done='1';answered++;if(got===expected){score++;p.querySelector('.feedback').textContent='✓ Correct!'}else{p.querySelector('.feedback').textContent='✗ Correct: '+expected}update()};p.querySelectorAll('.btn')[1].onclick=()=>{if(!p.dataset.done){selected=[];render()}};box.appendChild(p)});t.appendChild(box)}else if(step[0]==='note'){let box=document.createElement('section');box.className='card note';box.innerHTML=`<h2>📓 GoodNotes – Your grammar notes</h2><p>${step[1]}</p><p class="muted">Write the complete template in GoodNotes and fill in every blank.</p><label><input type="checkbox" class="notes-done"> I have completed the GoodNotes template.</label>`;t.appendChild(box)}});update()}function update(){if($('progress'))$('progress').textContent=answered+' / '+total+' answered · '+score+' correct'}function finishStation(){if(!document.querySelector('.notes-done')?.checked){$('result').innerHTML='<b>GoodNotes first!</b> Complete the template and tick the box.';return}if(answered<total){$('result').innerHTML='<b>Not finished yet!</b> Please answer all questions first. '+answered+' / '+total;return}let done=readProgress();done[current]=true;saveProgress(done);$('result').innerHTML=`<h2>🎉 Station complete!</h2><p>${score} / ${total} correct. Check your GoodNotes notes before you move on.</p><button class="btn" onclick="menu()">Back to map 🗺️</button>`;window.scrollTo(0,0)}function startGame(i){current=10+i;gameIndex=0;score=0;gameQs=[...D.games[i][1]].sort(()=>Math.random()-.5);$('app').innerHTML=`<button class="btn ghost" onclick="menu()">← All stations</button><div class="hero"><div class="animals">${['🦘','🐊','🏄','🧭'][i]}</div><h1>GAME ${i+6}</h1><h2>${esc(D.games[i][0])}</h2><p>Tap the correct answer. 10 rounds!</p></div><div id="game"></div>`;nextGame()}function nextGame(){let g=$('game');if(gameIndex>=gameQs.length){g.innerHTML=`<div class="card"><h2>🏆 Game over!</h2><h1>${score} / ${gameQs.length} ⭐</h1><p>${score===10?'Amazing!':score>=7?'Great job!':'Keep practising!'}</p><button class="btn" onclick="startGame(${current-10})">🔁 Play again</button><button class="btn ghost" onclick="menu()">Back to stations</button></div>`;return}let q=gameQs[gameIndex];g.innerHTML=`<div class="card"><div class="tag">ROUND ${gameIndex+1} / ${gameQs.length} · ⭐ ${score}</div><h2>${esc(q[0])}</h2><div class="options">${[...q[2]].sort(()=>Math.random()-.5).map(a=>`<button class="option">${esc(a)}</button>`).join('')}</div><div class="feedback"></div><div id="next"></div></div>`;g.querySelectorAll('.option').forEach(b=>b.onclick=()=>{if(g.dataset.lock)return;g.dataset.lock='1';let ok=b.textContent===q[1];if(ok)score++;g.querySelectorAll('.option').forEach(x=>{x.disabled=true;if(x.textContent===q[1])x.classList.add('good')});if(!ok)b.classList.add('bad');g.querySelector('.feedback').textContent=ok?'✓ Brilliant!':'✗ Correct: '+q[1];g.querySelector('#next').innerHTML='<button class="btn">Next →</button>';g.querySelector('#next .btn').onclick=()=>{gameIndex++;g.dataset.lock='';nextGame()}})}menu();</script></bod
