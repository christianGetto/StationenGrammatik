function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){console.warn('Local storage unavailable',e)}}function active(){return db.profiles[db.active]}function blank(name){return {name,records:{},runs:{},created:Date.now()}}function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}function pick(a,n){return shuffle(a).slice(0,n)}function button(text,action,cls=''){return `<button class="btn ${cls}" onclick="${esc(action)}">${text}</button>`}function heroHeader(){return `<header class="hero"><div class="animals">🦘 🐨 🏄 🐢</div><h1>AUSTRALIA QUEST</h1><p>Simple Past Adventure · 7 missions · Your own journey</p></header>`}function shell(content){document.getElementById('app').innerHTML=heroHeader()+content}function badgeList(p){let r=p.records,done=Object.values(r).filter(x=>x.done).length,three=Object.values(r).filter(x=>x.stars===3).length;return [['🦘','Kangaroo Rookie',done>=1],['🐨','Koala Collector',done>=3],['🏄','Surfing Star',three>=1],['🐊','Crocodile Hunter',done>=7],['🏆','Australia Legend',three>=7]]}function star(n){return `<span class="stars">${'★'.repeat(n)}${'☆'.repeat(3-n)}</span>`}function profileScreen(){let entries=Object.entries(db.profiles).map(([id,p])=>`<div class="flex card"><div><strong>${esc(p.name)}</strong><div class="muted small">${Object.values(p.records).filter(x=>x.done).length}/7 missions complete</div></div><div>${button('Play',`chooseProfile('${id}')`)} ${button('Rename',`renameProfile('${id}')`,'light')} ${button('Delete',`deleteProfile('${id}')`,'alt')}</div></div>`).join('');shell(`<div class="card"><h2>Choose your explorer 🧭</h2><p class="muted">Progress is saved on this iPad only. Anyone using this browser can open a profile.</p>${entries||'<p>No explorers yet. Create your first profile!</p>'}<div class="flex"><input class="input" id="newName" maxlength="35" placeholder="Explorer name">${button('Create explorer','createProfile()')}</div></div>`)}
function createProfile(){let n=document.getElementById('newName').value.trim();if(!n)return alert('Please enter a name.');let id='p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);db.profiles[id]=blank(n);db.active=id;save();home()}function chooseProfile(id){db.active=id;save();home()}function renameProfile(id){let n=prompt('New explorer name:',db.profiles[id].name);if(n&&n.trim()){db.profiles[id].name=n.trim().slice(0,35);save();profileScreen()}}function deleteProfile(id){let p=db.profiles[id];if(confirm(`Delete ${p.name}'s profile and ALL progress? This cannot be undone.`)){delete db.profiles[id];if(db.active===id)db.active=null;save();profileScreen()}}

function mc(prompt,answer,opts,hint,de,extra={}){return {type:'mc',prompt,answer,opts:shuffle([answer,...pick([...new Set(opts.filter(o=>o!==answer))],3)]),hint,de,...extra}}function typed(prompt,answer,hint,de,extra={}){return {type:'text',prompt,answer,hint,de,...extra}}function makeRegular(){
 const groups=[['play','stay','watch','visit','cook','rain','open'],['live','dance','move','explore'],['study','carry','try','hurry'],['enjoy','play','stay'],['stop','plan','hop','drop']];
 const used=new Set(),chosen=[];
 for(let g=0;g<5;g++){let pool=shuffle(regular.filter(x=>groups[g].includes(x[0])&&!used.has(x[0])));let row=pool[0];if(row){chosen.push(row);used.add(row[0])}}
 for(let g=0;g<5;g++){let pool=shuffle(regular.filter(x=>groups[g].includes(x[0])&&!used.has(x[0])));let row=pool[0];if(row){chosen.push(row);used.add(row[0])}}
 // Each spelling rule appears twice; one MC and one typed answer.
 let mcRows=shuffle(chosen.slice(0,5)),textRows=shuffle(chosen.slice(5));
 function build(x,isMC){let base=x[0],past=x[1],hint=base.endsWith('y')?( /[aeiou]y$/.test(base)?'A vowel before -y: add -ed.':'A consonant before -y: change y to -ied.'):base.endsWith('e')?'After -e, add -d.':['stop','plan','hop','drop'].includes(base)?'Double the last consonant before -ed.':'Most regular verbs add -ed.';
 let distract=[base,base+'ed',base+'d',base.replace(/y$/,'ied'),base.replace(/(.)$/,'$1$1ed'),base.replace(/y$/,'yed')].filter(v=>v!==past);
 return isMC?mc(`Verb: ${base} · ${x[2]}`,past,distract,hint,'Wähle die richtige Simple-Past-Form.'):typed(`Verb: ${base} · ${x[2]}`,past,hint,'Schreibe die richtige Simple-Past-Form.')}
 return shuffle([...mcRows.map(x=>build(x,true)),...textRows.map(x=>build(x,false))])}
function makeIrregular(){let rows=pick(irregular.filter(x=>x[0]!=='be'),10);return shuffle(rows.map((x,i)=>i<5?mc(`Verb: ${x[0]} · ${x[2]}`,x[1],pick(irregular.map(y=>y[1]).filter(y=>y!==x[1]),3),`${x[0]} is irregular: it does not take -ed.`,'Wähle die richtige unregelmäßige Vergangenheitsform.'):typed(`Verb: ${x[0]} · ${x[2]}`,x[1],`${x[0]} is irregular. Think of its past form.`,'Schreibe die richtige unregelmäßige Vergangenheitsform.')))}
function makeNeg(){let reg=pick(events.filter(x=>x[1].endsWith('ed')),5),irr=pick(events.filter(x=>!x[1].endsWith('ed')),5);let rows=shuffle([...reg.slice(0,2),...irr.slice(0,3)]).map(x=>[x,true]).concat(shuffle([...reg.slice(2),...irr.slice(3)]).map(x=>[x,false]));return shuffle(rows.map(([x,isMC],i)=>{let subj=subjects[i%subjects.length],base=`${subj} ${x[1]} ${x[2]} ${x[3]}.`,answer=`${subj} didn't ${x[0]} ${x[2]} ${x[3]}.`;return isMC?mc(`Make it negative: ${base}`,answer,[`${subj} didn't ${x[1]} ${x[2]} ${x[3]}.`,`${subj} not ${x[0]} ${x[2]} ${x[3]}.`,`${subj} doesn't ${x[0]} ${x[2]} ${x[3]}.`],"Use didn't + base verb, not the past form.",'Verneine den Satz im Simple Past.'):typed(`Make it negative: ${base}`,answer,"Use didn't + the base form of the verb.",'Schreibe den vollständigen verneinten Satz.')}))}
function makeQuestions(){let rows=pick(events,10);return shuffle(rows.map((x,i)=>{let subj=subjects[i%subjects.length],answer=`Did ${subj} ${x[0]} ${x[2]} ${x[3]}?`,source=`${subj} ${x[1]} ${x[2]} ${x[3]}.`;return i<5?{type:'order',prompt:`Make a Did question: ${source}`,answer,parts:shuffle(['Did',subj,x[0],...x[2].split(' '),...x[3].split(' ')]),hint:'Did + subject + base verb + ... ?',de:'Ordne die Wortbausteine zu einer Frage.'}:typed(`Write a Did question: ${source}`,answer,'Start with Did. Use the base verb after the subject.','Schreibe eine vollständige Entscheidungsfrage mit Did.')}))}
function makeSignals(){let scenes=shuffle(signalScenes);return shuffle(scenes.map((x,i)=>i<5?mc(`Find the time expression in this sentence: ${x[0].replace('___',x[1])}`,x[1],pick(words.filter(w=>w!==x[1]),3),'Look for the words that tell us WHEN it happened.','Finde die Zeitangabe im Satz.'):mc(`${x[0]} (${x[2]})`,x[1],pick(words.filter(w=>w!==x[1]),3),'Use the meaning in brackets to choose the matching past time expression.','Setze die Zeitangabe passend zur Erklärung in Klammern ein.')))}
function makeStory(path){
 let coast=path==='coast';
 let stages=coast?[
 ['Yesterday morning, you arrived at the sunny coast. Your first mission is to get ready for the beach.','visit','visited','the beach','verb'],
 ['The waves were high. You wanted to describe what you did.','surf','surfed','at the beach','verb'],
 ['A guide showed you the Great Barrier Reef. Tell your friends what you saw.','see','saw','a sea turtle','verb'],
 ['The water was clear. You took photos of the colourful fish.','take','took','photos','verb'],
 ['A storm was coming! Tell the ranger what you did NOT do.','swim','swam','in the deep water','neg'],
 ['Your camera was wet. Tell your friend what you did NOT do.','drop','dropped','the camera','neg'],
 ['The boat was full. Explain what you did NOT do.','go','went','on the boat','neg'],
 ['You met a marine biologist. Ask about her day.','visit','visited','the reef','question'],
 ['The ranger knows the animals. Ask about a dolphin.','see','saw','a dolphin','question'],
 ['Your friend is smiling. Ask about snorkelling.','go','went','snorkelling','question'],
 ['Your travel diary is missing a date. Find the right expression.','signal','',0,'signal'],
 ['The sea turtle appears again! Complete the final diary entry.','signal','',1,'signal']
 ]:[
 ['Yesterday morning, you arrived in the Australian Outback. The red earth stretched to the horizon.','visit','visited','Uluru','verb'],
 ['You pitched a tent beneath the stars.','camp','camped','near Uluru','verb'],
 ['At sunrise, you spotted a kangaroo.','see','saw','a kangaroo','verb'],
 ['Your guide gave you a map before the hike.','take','took','a map','verb'],
 ['The trail was closed. Tell the ranger what you did NOT do.','walk','walked','on the closed trail','neg'],
 ['It was too windy. Tell your friend what you did NOT do.','sleep','slept','outside','neg'],
 ['The campfire was not allowed. Explain what you did NOT do.','make','made','a fire','neg'],
 ['Ask the ranger about the famous rock.','visit','visited','Uluru','question'],
 ['Ask your friend about the wildlife.','see','saw','a kangaroo','question'],
 ['Ask the guide about the night in camp.','sleep','slept','in a tent','question'],
 ['The travel diary is missing a date. Find the right expression.','signal','',2,'signal'],
 ['The sun sets over the red rocks. Complete your final diary entry.','signal','',3,'signal']
 ];
 let signalIds=coast?[0,1]:[6,8];
 return stages.map((st,k)=>{let [narr,base,past,obj,kind]=st;let extra={story:`Chapter ${k+1}/12 · ${narr}`,chapter:k+1};
 if(kind==='verb')return typed(`Complete your diary: We ___ ${obj} yesterday. (Verb: ${base})`,past,`Use the Simple Past of ${base}.`,'Setze das Verb in die Vergangenheit.',extra);
 if(kind==='neg')return typed(`Make negative: We ${past} ${obj} yesterday.`,`We didn't ${base} ${obj} yesterday.`,"Use didn't + base verb.",'Schreibe den ganzen verneinten Satz.',extra);
 if(kind==='question')return typed(`Ask a Did question: Mia ${past} ${obj} yesterday.`,`Did Mia ${base} ${obj} yesterday?`,'Did + subject + base verb.','Bilde eine vollständige Did-Frage.',extra);
 let x=signalScenes[signalIds[Number(obj)]];return mc(`Choose the time expression: ${x[0]} (${x[2]})`,x[1],pick(words.filter(w=>w!==x[1]),3),'Match the expression to the exact time clue.','Wähle die Zeitangabe passend zur Erklärung.',extra)
 })}
function makeDetectives(){return shuffle(detective.map(x=>({type:'detect',prompt:x[0],answer:x[2],wrong:x[1],hint:x[3],de:'Tippe auf das falsche Wort und verbessere es.',explanation:x[3]})))}
function generate(i,path){return [makeRegular,makeIrregular,makeNeg,makeQuestions,makeSignals,()=>makeStory(path),makeDetectives][i]()}function startRun(i,path){let p=active();p.runs[i]={i,path:path||'',questions:generate(i,path),index:0,answers:[],attempt:0,done:false,selected:'',order:[],wrongSelected:'',hint:false,feedback:'',success:false,reveal:false};save();renderRun(i)}function normalize(s){return String(s).toLowerCase().replace(/[’‘`´]/g,"'").replace(/\bdid\s+not\b/g,"didn't").replace(/[.!?,;:]/g,' ').replace(/\s+/g,' ').trim()}function valid(q,val){return normalize(val)===normalize(q.answer)}function getRun(i){return active().runs[i]}function updateRun(i,fn){fn(getRun(i));save();renderRun(i)}
function renderRun(i){let p=active(),r=getRun(i);if(!r)return openStation(i);if(r.done)return finishRun(i);let q=r.questions[r.index],n=r.questions.length;let choices='';if(q.type==='mc')choices=`<div class="choices">${q.opts.map(o=>`<button class="choice ${r.selected===o?'selected':''}" onclick="setChoice(${i},${JSON.stringify(o).replace(/"/g,'&quot;')})">${esc(o)}</button>`).join('')}</div>`;if(q.type==='text')choices=`<input class="input" id="answerInput" placeholder="Type your answer ..." autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(r.selected)}" oninput="setText(${i},this.value)" onkeydown="if(event.key==='Enter')checkAnswer(${i})">`;if(q.type==='order')choices=`<div class="answerline" onclick="removeLast(${i})">${r.order.map(x=>`<span class="word">${esc(x)}</span>`).join(' ')||'<span class="muted">Tap the words below to build your question. Tap here to undo.</span>'}</div><div class="words">${q.parts.map((x,j)=>`<button class="word ${r.orderIds?.includes(j)?'used':''}" onclick="addWord(${i},${j})" ${r.orderIds?.includes(j)?'disabled':''}>${esc(x)}</button>`).join('')}</div>`;if(q.type==='detect'){let toks=q.prompt.match(/\S+/g)||[];choices=`<p>Tap the incorrect word:</p><div>${toks.map((x,j)=>`<button class="errorword ${r.wrongSelected===String(j)?'selected':''}" onclick="setWrong(${i},'${j}')">${esc(x)}</button>`).join('')}</div><p>Write the correct word:</p><input class="input" id="answerInput" placeholder="Correct word" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(r.selected)}" oninput="setText(${i},this.value)" onkeydown="if(event.key==='Enter')checkAnswer(${i})">`};let help=r.hint?`<div class="hint">💡 ${esc(q.hint)}</div>`:'';let msg=r.feedback?`<div class="hint ${r.reveal?(r.success?'good':'bad'):'hint-warn'}" role="status">${esc(r.feedback)}</div>`:'';let story=q.story?`<div class="story">🌏 ${esc(q.story)}</div>`:'';shell(`<div class="topnav">${button('← Save & Exit','home()','light')}<span class="pill">${esc(p.name)} · Mission ${i+1}</span>${button('DE 🇩🇪',`showGerman(${i})`,'light')}</div><div class="card"><div class="flex"><strong>${stations[i][1]} ${esc(stations[i][0])}</strong><span class="pill">Challenge ${r.index+1}/${n}</span></div><div class="progress" style="margin:12px 0"><div style="width:${r.index/n*100}%"></div></div>${story}<div class="qbox"><div class="tag">${q.type==='detect'?'Grammar Detectives':q.type==='order'?'Word puzzle':q.type==='mc'?'Choose the answer':'Write the answer'}</div><h2>${esc(q.prompt)}</h2>${choices}<div class="toolbar">${button('💡 Hint',`showHint(${i})`,'light')} ${q.type==='order'?button('Clear words',`clearOrder(${i})`,'light'):''}</div>${help}${msg}</div><div class="flex">${r.reveal?button('Next challenge →',`nextQuestion(${i})`):button('Check answer ✓',`checkAnswer(${i})`)}<span class="muted small">${r.attempt}/2 tries used</span></div></div>`);if(q.type==='text'||q.type==='detect'){let inp=document.getElementById('answerInput');if(inp&&r.attempt===0&&!r.feedback){} }}
function setChoice(i,v){updateRun(i,r=>r.selected=v)}function setText(i,v){let r=getRun(i);r.selected=v;save()}function setWrong(i,v){updateRun(i,r=>r.wrongSelected=v)}function addWord(i,j){updateRun(i,r=>{if(!r.orderIds)r.orderIds=[];if(!r.orderIds.includes(j)){r.orderIds.push(j);r.order.push(r.questions[r.index].parts[j])}})}function removeLast(i){updateRun(i,r=>{r.order.pop();r.orderIds?.pop()})}function clearOrder(i){updateRun(i,r=>{r.order=[];r.orderIds=[]})}function showHint(i){updateRun(i,r=>r.hint=true)}function showGerman(i){let q=getRun(i).questions[getRun(i).index];document.body.insertAdjacentHTML('beforeend',`<div class="modalshade" id="helpModal" onclick="if(event.target===this)this.remove()"><div class="modal"><h2>🇩🇪 Deutsche Hilfe</h2><p>${esc(q.de)}</p><p class="muted">${esc(q.hint)}</p>${button('Close','document.getElementById("helpModal").remove()')}</div></div>`)}
function checkAnswer(i){let r=getRun(i),q=r.questions[r.index];if(r.reveal)return;let response=q.type==='order'?r.order.join(' '):r.selected;if(!response.trim())return alert('Please enter an answer first.');if(q.type==='detect'&&r.wrongSelected==='')return alert('Tap the incorrect word first.');let ok=valid(q,response);if(q.type==='detect'){let toks=q.prompt.match(/\S+/g)||[],selected=toks[Number(r.wrongSelected)]||'';ok=ok&&normalize(selected)===normalize(q.wrong)}if(ok){r.success=true;r.answers.push({ok:true,tries:r.attempt+1});r.feedback='Great work! ✓ '+(q.explanation||'');r.reveal=true}else{r.success=false;r.attempt++;if(r.attempt>=2){r.answers.push({ok:false,tries:2});r.feedback=`Correct answer: ${q.answer}. ${q.explanation||q.hint}`;r.reveal=true}else{r.feedback='Not quite! '+q.hint+' Try again.';r.hint=true;r.selected='';r.order=[];r.orderIds=[];r.wrongSelected=''}}save();renderRun(i)}
function nextQuestion(i){let r=getRun(i);if(!r.reveal)return;r.index++;r.attempt=0;r.selected='';r.order=[];r.orderIds=[];r.wrongSelected='';r.hint=false;r.feedback='';r.success=false;r.reveal=false;if(r.index>=r.questions.length){r.done=true}save();renderRun(i)}
function finishRun(i){let p=active(),r=getRun(i),correct=r.answers.filter(a=>a.ok).length,total=r.questions.length,ratio=correct/total,stars=ratio>=.9?3:ratio>=.7?2:1,old=p.records[i];let best=(old&&old.correct>=correct)?old.correct:correct;let bestStars=best/total>=.9?3:best/total>=.7?2:1;p.records[i]={done:true,stars:bestStars,correct:best,total,plays:(old?.plays||0)+1};delete p.runs[i];save();let ending=i===5?(r.path==='coast'?'🐢 A sea turtle swims beside you at the Great Barrier Reef. Your coastal adventure ends with an unforgettable discovery!':'🌅 The sun sets over Uluru. The red rocks glow as your Outback adventure comes to a beautiful end!'):'';let after=`<div class="card confetti"><h2>🎉 Mission complete!</h2>${ending?`<div class="story">${ending}</div>`:''}<p>${esc(stations[i][0])}</p><div>${star(stars)}</div><p><strong>${correct}/${total}</strong> challenges solved independently (within two tries).</p><p class="muted">Your best stars are saved. Replay to improve your score!</p>${i<5?`<div class="hint good">${noteContent(i)}${button('Done',`endMission(${i})`)} ${button('Skip',`endMission(${i})`,'light')}</div>`:button('Back to map',`endMission(${i})`)} ${button('Play again',`replay(${i})`,'light')}</div>`;shell(`<div class="topnav">${button('← Map','home()','light')}</div>${after}`)}
function endMission(i){home()}function replay(i){delete active().runs[i];save();openStation(i)}function showNote(i){document.body.insertAdjacentHTML('beforeend',`<div class="modalshade" id="noteModal" onclick="if(event.target===this)this.remove()"><div class="modal">${noteContent(i)}${button('Close','document.getElementById("noteModal").remove()')}</div></div>`)}function certificate(){let p=active(),done=Object.values(p.records).filter(r=>r.done).length;if(done!==7)return home();let sum=Object.values(p.records).reduce((a,r)=>a+r.stars,0);shell(`<div class="topnav noprint">${button('← My Progress','progressPage()','light')} ${button('Print / Save PDF','window.print()','gold')}</div><div class="card cert confetti"><div style="font-size:60px">🏆 🦘 🐨</div><h2>AUSTRALIA QUEST</h2><h3>Simple Past Adventure Certificate</h3><p>This certifies that</p><h2>${esc(p.name)}</h2><p>has successfully completed all seven missions and explored the Simple Past across Australia!</p><div class="stars">${'★'.repeat(Math.min(21,sum))}</div><p><strong>${sum} / 21 stars collected</strong></p><p>🌊 Great Barrier Reef · 🏜️ Outback · 🦘 Australia</p><p class="muted">Keep exploring. Keep learning.</p></div><p class="note noprint">On iPad, use Print / Save PDF and the system share or print options. PDF saving depends on the browser.</p>`)}
if(db.active&&!db.profiles[db.active])db.active=null;save();if(active())home();else profileScreen();
</script></body></html>
