:root{--navy:#14283e;--blue:#237a98;--coral:#f57a57;--gold:#ffd36d;--mint:#d8f4e9}*{box-sizing:border-box}body{margin:0;font:17px/1.55 system-ui,-apple-system,Arial,sans-serif;color:var(--navy);background:radial-gradient(circle at 8% 5%,#fff0bf,transparent 30%),radial-gradient(circle at 90% 30%,#bce9e9,transparent 40%),#f5f8f5;min-height:100vh}.wrap{max-width:940px;margin:auto;padding:16px}.hero{background:linear-gradient(120deg,#163a57,#237f96);border-radius:25px;color:white;padding:28px;box-shadow:0 12px 30px #1b52652b}.hero h1{font-size:clamp(30px,6vw,54px);line-height:1.1;margin:8px 0}.hero p{margin:8px 0}.badge{display:inline-block;background:#ffffff2a;padding:5px 12px;border-radius:20px;font-size:13px;font-weight:800;letter-spacing:.1em}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:20px 0}.tile,.card{background:white;border:2px solid #dce9e7;border-radius:20px;padding:19px;box-shadow:0 5px 18px #22404a0e}.tile{cursor:pointer;text-align:left;font:inherit;color:inherit;min-height:145px}.tile:hover,.tile:focus-visible{border-color:var(--coral)}.tile strong{display:block;font-size:21px}.tile small{display:block;color:#526678}.emoji{font-size:37px}.btn{border:0;background:#176b86;color:white;font:inherit;font-weight:750;padding:11px 18px;border-radius:12px;cursor:pointer;margin:5px 6px 5px 0}.btn.alt{background:#eaf2f1;color:#19374b}.btn.orange{background:#b34b32}.btn:disabled{opacity:.5;cursor:default}.card{margin:17px 0}.rule{border-left:7px solid #f4ae49;background:#fffcf3}.example{background:#eaf6f5;padding:12px;border-radius:12px;margin:12px 0}.tip{background:#fff1df;border-radius:10px;padding:10px}.q{padding:15px 0;border-top:1px solid #e4ebea}.q:first-child{border-top:0}.options{display:flex;flex-wrap:wrap;gap:9px;margin:10px 0}.option{border:2px solid #a8cbd1;background:white;border-radius:12px;padding:10px 16px;font:inherit;cursor:pointer;min-width:65px}.option.ok{background:#d5f6dc;border-color:#27985a}.option.no{background:#ffe1dd;border-color:#d95745}.feedback{font-weight:700;min-height:23px}.word{border:0;background:transparent;font:inherit;color:inherit;padding:1px 3px;border-radius:6px;cursor:pointer}.word.chosen{background:#ffce66;box-shadow:inset 0 -2px #e4a52a}.passage{line-height:2.4;font-size:19px}.field{font:inherit;border:2px solid #a7c6ce;border-radius:9px;padding:9px;width:min(100%,380px)}.field:focus{outline:3px solid #ffd36d}.small{color:#516b78;font-size:15px}.progress{font-weight:800;background:#e9f4f2;padding:9px 13px;border-radius:12px}.stars{font-size:30px}.footer{padding:20px 0 35px;color:#627884;font-size:13px}.hide{display:none}h2{line-height:1.25}.complete{background:#e1f7e8;border:2px solid #6ebf8a;border-radius:13px;padding:12px}.tag{color:#b24e35;font-weight:800;letter-spacing:.05em;font-size:13px}.mark{font-size:16px;font-weight:750}.pill{display:inline-block;border-radius:50px;background:#fff2d4;padding:4px 10px;margin:3px}.sentence{font-size:18px}.topbar{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.help{font-size:15px;color:#4c6571}.questioncount{background:#f5f9f8;border-radius:10px;padding:9px}.success{color:#137e46}.error{color:#b94034}@media(max-width:500px){.wrap{padding:10px}.hero{padding:20px}.card{padding:15px}.passage{font-size:17px}}

tired", "aren’t"], ["Our classroom", "small", "isn’t"], ["My parents", "at work", "aren’t"], ["Ben", "my brother", "isn’t"], ["I", "at home", "am not"], ["The bikes", "red", "aren’t"], ["My friends", "in the garden", "aren’t"], ["Emma", "at school", "isn’t"], ["You and Ben", "late", "aren’t"], ["The window", "open", "isn’t"], ["My grandparents", "here", "aren’t"]], "texts": ["My name is Tom and <button type=\"button\" class=\"word\" data-pron=\"1\">I</button> am from Plymouth. <button type=\"button\" class=\"word\" data-pron=\"1\">I</button> am ten years old and <button type=\"button\" class=\"word\" data-pron=\"1\">I</button> have got two brothers. <button type=\"button\" class=\"word\" data-pron=\"1\">They</button> are five and eight years old. My dad is a teacher. <button type=\"button\" class=\"word\" data-pron=\"1\">He</button> is nice. And my mum is a teacher, too. <button type=\"button\" class=\"word\" data-pron=\"1\">She</button> is always happy. <button type=\"button\" class=\"word\" data-pron=\"1\">We</button> have a cat. <button type=\"button\" class=\"word\" data-pron=\"1\">It</button> is always hungry. And <button type=\"button\" class=\"word\" data-pron=\"1\">you</button>?", "Hi! <button type=\"button\" class=\"word\" data-pron=\"1\">I</button> am Mia. My brother is Ben. <button type=\"button\" class=\"word\" data-pron=\"1\">He</button> is eleven. <button type=\"button\" class=\"word\" data-pron=\"1\">We</button> are from London. Our parents are teachers. <button type=\"button\" class=\"word\" data-pron=\"1\">They</button> are funny. My sister is Lily. <button type=\"button\" class=\"word\" data-pron=\"1\">She</button> is seven. <button type=\"button\" class=\"word\" data-pron=\"1\">We</button> have a dog. <button type=\"button\" class=\"word\" data-pron=\"1\">It</button> is small. And <button type=\"button\" class=\"word\" data-pron=\"1\">you</button>?", "Hello! My name is Alex. <button type=\"button\" class=\"word\" data-pron=\"1\">I</button> am in class 5. My friend is Sam. <button type=\"button\" class=\"word\" data-pron=\"1\">He</button> is very nice. <button type=\"button\" class=\"word\" data-pron=\"1\">We</button> play football. My mum is at home. <button type=\"button\" class=\"word\" data-pron=\"1\">She</button> is happy. My grandparents are here, too. <button type=\"button\" class=\"word\" data-pron=\"1\">They</button> are kind. <button type=\"button\" class=\"word\" data-pron=\"1\">I</button> have a bike. <button type=\"button\" class=\"word\" data-pron=\"1\">It</button> is blue. And <button type=\"button\" class=\"word\" data-pron=\"1\">you</button>?"]};const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let stationNo=0,questions=[],responses={},done=readDone();function readDone(){try{return JSON.parse(localStorage.getItem('grammarIsland5_done')||'{}')}catch(e){return {}}}function storeDone(){try{localStorage.setItem('grammarIsland5_done',JSON.stringify(done))}catch(e){}}function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function sample(a,n){return shuffle(a).slice(0,n)}function balancedPron(a,n){const groups={};a.forEach(row=>(groups[row[1].toLowerCase()]??=[]).push(row));const keys=['i','you','he','she','it','we','they'];const result=[];let index=0;while(result.length<n){const key=keys[index%keys.length];if(groups[key]?.length){const item=shuffle(groups[key]).pop();groups[key].splice(groups[key].indexOf(item),1);result.push(item)}index++;if(index>1000)break;}return shuffle(result)}
function balancedSwitch(a,n){const groups={};a.forEach(row=>(groups[row[1].toLowerCase()]??=[]).push(row));const keys=['you','he','she','it','we','they'];const result=[];let index=0;while(result.length<n){const key=keys[index%keys.length];if(groups[key]?.length){const item=shuffle(groups[key]).pop();groups[key].splice(groups[key].indexOf(item),1);result.push(item)}index++;if(index>1000)break;}return shuffle(result)}function menu(){stationNo=0;let cards=[['🔎','Personal Pronouns','I · you · he · she · it · we · they'],['🌟','The verb (to) be','am · is · are'],['🚫','Negative (to) be','am not · isn’t · aren’t'],['🇩🇪','Translation Challenge','Deutsch → Englisch'],['🏆','Grammar Mix','Alles gemischt üben']];$('#app').innerHTML=`<div class="hero"><div class="badge">ENGLISH · CLASS 5 · LEARNING STATIONS</div><h1>🏝️ GRAMMAR ISLAND</h1><p>Five big adventures. Learn the rules, practise and collect stars!</p><p>👋 Du darfst Fehler machen. Hier wird geübt, nicht benotet.</p></div><div class="card"><strong>So geht's:</strong> Wähle eine Station. Lies zuerst die einfache Erklärung. Löse dann die Aufgaben. Du bekommst direkt eine Rückmeldung und kannst es noch einmal versuchen. <b>Jede Station hat viele Aufgaben und bei jeder neuen Runde eine neue Zufallsauswahl.</b></div><div class="grid">${cards.map((c,i)=>`<button class="tile" onclick="openStation(${i+1})"><span class="emoji">${c[0]}</span><strong>${i+1}. ${c[1]} ${done[i+1]?'✅':''}</strong><small>${c[2]}</small></button>`).join('')}</div><div class="footer">Lernstationen für Klasse 5 · Funktioniert auch ohne Internet · Fortschritt auf diesem Gerät gespeichert.</div>`}
const ruleText={1:`<h2>🔎 Personal Pronouns – persönliche Fürwörter</h2><p>Ein <b>Personalpronomen</b> ist ein kleines Wort, das einen Namen oder eine Sache ersetzt.</p><div class="example"><b>Tom</b> → <b>he</b> (er)<br><b>Mia</b> → <b>she</b> (sie)<br><b>the cat</b> → <b>it</b> (es)<br><b>Tom and Mia</b> → <b>they</b> (sie – mehrere)</div><p><span class="pill">I = ich</span><span class="pill">you = du / ihr</span><span class="pill">he = er</span><span class="pill">she = sie</span><span class="pill">it = es</span><span class="pill">we = wir</span><span class="pill">they = sie</span></p><div class="tip"><b>Merke:</b> <b>Tom and I</b> = <b>we</b> (wir). <b>You and Mia</b> = <b>you</b> (ihr). Bei mehreren anderen Personen oder Tieren benutzt du <b>they</b>. <b>You and I</b> = <b>we</b> (du und ich = wir).</div>`,2:`<h2>🌟 The verb (to) be – sein</h2><p>Das englische Wort <b>to be</b> bedeutet <b>sein</b>. Es verändert sich je nachdem, wer gemeint ist.</p><div class="example"><b>I am</b> happy. → Ich bin glücklich.<br><b>You are</b> nice. → Du bist nett.<br><b>He is</b> ten. → Er ist zehn.<br><b>She is</b> at home. → Sie ist zu Hause.<br><b>It is</b> new. → Es ist neu.<br><b>We are</b> friends. → Wir sind Freunde.<br><b>They are</b> here. → Sie sind hier.</div><div class="tip"><b>Super-Merksatz:</b> <b>I am</b> · <b>he/she/it is</b> · <b>you/we/they are</b>.</div><p><b>Kurzformen:</b> I am → <b>I'm</b> · he is → <b>he's</b> · she is → <b>she's</b> · it is → <b>it's</b> · you are → <b>you're</b> · we are → <b>we're</b> · they are → <b>they're</b>.</p><p class="small">In den Lücken wählst du die lange Form (am/is/are), außer wenn ausdrücklich nach einer Kurzform gefragt wird. <b>Achtung:</b> I → am, eine Person oder Sache → is, mehrere Personen oder Sachen → are.</p>`,3:`<h2>🚫 Negative (to) be – Verneinung</h2><p>Wenn du sagen willst, dass etwas <b>nicht</b> so ist, setzt du <b>not</b> hinter am, is oder are.</p><div class="example"><b>I am not</b> tired. → Ich bin nicht müde.<br><b>He is not</b> tired. → <b>He isn't</b> tired.<br><b>They are not</b> here. → <b>They aren't</b> here.</div><div class="tip"><b>Merke:</b> I → <b>am not</b> · he/she/it → <b>isn't</b> · you/we/they → <b>aren't</b>.<br>Beides ist richtig: <b>is not / isn't</b> und <b>are not / aren't</b>.</div><p>Wichtig: <b>am not</b> hat keine Kurzform wie „amn’t“. Bei <b>is not</b> und <b>are not</b> sind lange und kurze Formen richtig.<br>Bei ganzen Sätzen bleibt der Rest gleich: <b>Mary is at home.</b> → <b>Mary isn't at home.</b></p>`,4:`<h2>🇩🇪 Translation Challenge – Deutsch → Englisch</h2><p>Du kannst jetzt kleine deutsche Sätze auf Englisch schreiben!</p><div class="example"><b>Ich bin glücklich.</b> → I am happy.<br><b>Sie ist nicht hier.</b> → She isn't here.</div><div class="tip"><b>So geht's:</b> 1. Wer? 2. am/is/are? 3. Brauchst du not?<br>Erst baust du Sätze mit Wortkärtchen, dann schreibst du sie selbst. Auch lange Formen wie <b>is not</b> sind richtig.</div>`,5:`<h2>🏆 Grammar Mix – alles zusammen!</h2><p>Du kannst schon viel: Personalpronomen, <b>am/is/are</b> und die Verneinung.</p><div class="example">Mia → <b>she</b><br>Mia <b>is</b> happy.<br>Mia <b>isn't</b> sad.</div><div class="tip"><b>Geheimtipp:</b> Überlege immer zuerst: <b>Wer?</b> Eine Person, mehrere Personen oder ich selbst? Dann findest du die richtige Form.</div>`};
const SWITCH=[['Lucy','She','is eleven years old.'],['Tom','He','is happy.'],['My bike','It','is new.'],['Mum and I','We','are at home.'],['My brother','He','is funny.'],['The cats','They','are hungry.'],['You and Mia','You','are friends.'],['My sister and I','We','are at school.'],['Dad','He','is tired.'],['Emma','She','is nice.'],['My parents','They','are here.'],['The books','They','are new.'],['My dog','It','is small.'],['Ben and I','We','are friends.'],['The car','It','is red.'],['Anna and Lily','They','are happy.'],['You and Tom','You','are late.'],['The pencil','It','is blue.'],['My grandparents','They','are at home.'],['The children','They','are at school.'],['My sister','She','is ten.'],['My uncle','He','is funny.'],['Our classroom','It','is big.'],['The bikes','They','are new.']];

const NOTEBOOK={1:`<b>Personal Pronouns – persönliche Fürwörter</b><br>I = ich · you = du/ihr · he = er · she = sie · it = es · we = wir · they = sie (mehrere).<br><b>Merke:</b> Ein Pronomen ersetzt einen Namen: Tom → he, Mia → she, Tom und Mia → they.`,2:`<b>To be = sein</b><br>I <b>am</b> · he/she/it <b>is</b> · you/we/they <b>are</b>.<br><b>Kurzformen:</b> I'm · he's · she's · it's · you're · we're · they're.`,3:`<b>Verneinung mit to be</b><br>Setze <b>not</b> hinter am/is/are.<br>I <b>am not</b> · he/she/it <b>is not / isn't</b> · you/we/they <b>are not / aren't</b>.`,4:`<b>Deutsch → Englisch</b><br>1. Wer? → Pronomen wählen.<br>2. am, is oder are einsetzen.<br>3. Bei „nicht“: not ergänzen.<br>Beispiel: Wir sind nicht müde. → We aren't tired.`,5:`<b>Grammar-Check</b><br>Wer? → I/you/he/she/it/we/they.<br>To be? → am/is/are.<br>Verneint? → not.<br><b>Merke:</b> He is happy. → He isn't happy.`};
function openStation(n){stationNo=n;responses={};questions=[];
if(n===1){balancedSwitch(SWITCH,10).forEach(([sub,pron,ending])=>questions.push({kind:'switch',sub,ans:pron,ending}));balancedSwitch(SWITCH,10).forEach(([sub,pron,ending])=>questions.push({kind:'power',sub,ans:pron+' '+(pron==='I'?'am':(['He','She','It'].includes(pron)?'is':'are')),ending}));questions.push({kind:'mark',text:DATA.texts[Math.floor(Math.random()*DATA.texts.length)]});balancedPron(DATA.pron,18).forEach(([sub,ans])=>questions.push({kind:'pron',sub,ans}));}
if(n===2){const endings=['happy.','at school.','very nice.','here.','in class 5.','at home.','ready.','ten years old.','from England.','in the garden.','my friend.','in the classroom.','at the park.','very funny.','tired.','eleven years old.','good friends.','at the bus stop.','late.','in the kitchen.'];sample(DATA.be,18).forEach(([sub,ans],i)=>questions.push({kind:'be',sub,ans,ending:endings[i]}));sample([['I am',"I'm"],['You are',"You're"],['He is',"He's"],['She is',"She's"],['It is',"It's"],['We are',"We're"],['They are',"They're"]],6).forEach(([sub,ans])=>questions.push({kind:'short',sub,ans}));}
if(n===3){const chosen=sample(DATA.neg,24);chosen.slice(0,12).forEach(([sub,ending,ans])=>questions.push({kind:'negative',sub,ending,ans}));chosen.slice(12,24).forEach(([sub,ending,ans])=>questions.push({kind:'rewrite',sub,ending,ans}));}
if(n===5){balancedPron(DATA.pron,8).forEach(([sub,ans])=>questions.push({kind:'pron',sub,ans}));const endings=['at home.','in class 5.','very happy.','at school.','ready.','from England.','my friend.','here.'];sample(DATA.be,8).forEach(([sub,ans],i)=>questions.push({kind:'be',sub,ans,ending:endings[i]}));const neg=sample(DATA.neg,12);neg.slice(0,6).forEach(([sub,ending,ans])=>questions.push({kind:'negative',sub,ending,ans}));neg.slice(6).forEach(([sub,ending,ans])=>questions.push({kind:'rewrite',sub,ending,ans}));}
if(n===4){sample(TRANSLATE.slice(0,10),5).forEach(([de,en])=>questions.push({kind:'translateTiles',de,ans:en}));sample(TRANSLATE.slice(10),10).forEach(([de,en])=>questions.push({kind:'translate',de,ans:en}));}
renderStation();}
function renderStation(){let title=['','Personal Pronouns','The verb (to) be','Negative (to) be','Translation Challenge','Grammar Mix'][stationNo];$('#app').innerHTML=`<div class="topbar"><button class="btn alt" onclick="menu()">← Stationen</button><span class="progress" id="prog">⭐ 0 / ${questions.length}</span></div><div class="hero"><span class="badge">STATION ${stationNo} / 5</span><h1>${['','🔎','🌟','🚫','🇩🇪','🏆'][stationNo]} ${title}</h1><p>Read · Try · Learn · Try again! · ${questions.length} challenges</p></div><section class="card rule">${ruleText[stationNo]}</section><section class="card notebook"><h2>📓 Für dein Englischheft – kurz & knackig</h2><p>${NOTEBOOK[stationNo]}</p><p class="small">Schreibe diese Regeln in dein Heft. Hake danach ab.</p><label><input type="checkbox" id="notebookCheck"> Regeln im Heft gesichert ✓</label></section><section class="card"><h2>✏️ Let's practise!</h2><p class="small">Du kannst jede Aufgabe verbessern. Ein grüner Haken zeigt dir, dass du es geschafft hast.</p><div id="qs"></div><div id="end" class="hide complete"></div></section><button class="btn alt" onclick="menu()">← Zurück zur Insel</button>`;questions.forEach((q,i)=>{let div=document.createElement('div');div.className='q';div.id='q'+i;div.innerHTML=makeQuestion(q,i);$('#qs').append(div);if(q.kind==='translateTiles'){setupTiles(div,q,i);}else if(q.kind==='mark'){let buttons=div.querySelectorAll('.word');buttons.forEach(b=>b.onclick=()=>{b.classList.toggle('chosen');let all=[...buttons];let ok=all.every(x=>x.classList.contains('chosen')===!!x.dataset.pron); // every tagged word is pron, other words are plain
let f=div.querySelector('.feedback');f.textContent=ok?'✓ Alle Personalpronomen gefunden!':'Markiere alle Personalpronomen im Text.';if(ok)complete(i);});}else if(['pron','be','negative'].includes(q.kind)){div.querySelectorAll('.option').forEach(b=>b.onclick=()=>checkChoice(i,b.textContent,b));}else{div.querySelector('.check').onclick=()=>checkText(i);div.querySelector('.field').addEventListener('keydown',e=>{if(e.key==='Enter')checkText(i)})}});updateProgress();}
function makeQuestion(q,i){let header=`<div class="tag">${q.kind==='mark'?'READING':`QUESTION ${i+1}`}</div>`;let options=[];let label='';if(q.kind==='mark')return `${header}<h3>Read the text and tap ALL personal pronouns.</h3><p class="small">Lies den Text und tippe auf alle persönlichen Fürwörter (I, you, he, she, it, we, they).</p><div class="passage">${q.text}</div><p class="feedback" aria-live="polite"></p>`;if(q.kind==='switch')return `${header}<h3>Replace the name with a personal pronoun.</h3><p class="sentence"><b>${esc(q.sub)}</b> → <b>_____</b></p><p class="small">Schreibe nur das passende Personalpronomen.</p><input class="field" autocapitalize="off" placeholder="Pronoun"><button class="btn check">Check ✓</button><p class="feedback"></p>`;if(q.kind==='power')return `${header}<h3>Replace the name. Use a pronoun and am/is/are.</h3><p class="sentence"><b>${esc(q.sub)}</b> → _____ _____ ${esc(q.ending.replace(/^(am|is|are)\s+/,''))}</p><input class="field" autocapitalize="off" placeholder="e.g. She is"><button class="btn check">Check ✓</button><p class="feedback"></p>`;if(q.kind==='translate')return `${header}<h3>Translate into English.</h3><p class="sentence">🇩🇪 ${esc(q.de)}</p><input class="field" autocapitalize="off" placeholder="Write the whole English sentence"><button class="btn check">Check ✓</button><p class="feedback"></p>`;if(q.kind==='translateTiles')return `${header}<h3>Build the English sentence. Tap the word cards.</h3><p class="sentence">🇩🇪 ${esc(q.de)}</p><div class="answer"></div><div class="chips"></div><button class="btn check">Check ✓</button><button class="btn alt resetTiles">Reset ↻</button><p class="feedback"></p>`;if(q.kind==='pron'){label=`<b>${esc(q.sub)}</b> = ?`;options=['I','you','he','she','it','we','they'];}if(q.kind==='be'){label=`${esc(q.sub)} <b>_____</b> ${esc(q.ending)}`;options=['am','is','are'];}if(q.kind==='negative'){label=`${esc(q.sub)} <b>_____</b> ${esc(q.ending)}`;options=['am not',"isn't","aren't"];}if(options.length)return `${header}<h3 class="sentence">${label}</h3><div class="options">${options.map(x=>`<button class="option" type="button">${esc(x)}</button>`).join('')}</div><p class="feedback" aria-live="polite"></p>`;if(q.kind==='short')return `${header}<h3>Write the short form (Kurzform):</h3><p>${esc(q.sub)} → ?</p><input class="field" autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="Write here"><button class="btn check">Check ✓</button><p class="feedback" aria-live="polite"></p>`;if(q.kind==='rewrite')return `${header}<h3>Make the sentence negative.</h3><p class="small">Schreibe den ganzen Satz in der Verneinung.</p><p class="sentence"><b>${esc(q.sub)} ${q.ans==='am not'?'am':q.ans==='isn’t'?'is':'are'} ${esc(q.ending)}</b></p><input class="field" autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="Write the whole sentence"><button class="btn check">Check ✓</button><p class="feedback" aria-live="polite"></p>`;return ''}
function norm(s){return String(s).trim().toLowerCase().replace(/[’‘´`]/g,"'").replace(/\s+/g,' ').replace(/[.!?]+$/,'').replace(/\s+/g,' ').trim()}
function complete(i){responses[i]=true;updateProgress();}function updateProgress(){let count=Object.keys(responses).length;$('#prog').textContent=`⭐ ${count} / ${questions.length}`;if(count===questions.length){done[stationNo]=true;storeDone();$('#end').classList.remove('hide');$('#end').innerHTML=`<h2>🎉 Fantastic! Station complete!</h2><p class="stars">⭐⭐⭐</p><p>Du hast alle Aufgaben geschafft. Gut gemacht!</p><button class="btn" onclick="menu()">Back to the island 🏝️</button><button class="btn alt" onclick="openStation(${stationNo})">Neue Zufallsrunde 🔄</button>`;}}
function checkChoice(i,answer,button){let q=questions[i],div=$('#q'+i),f=div.querySelector('.feedback');if(norm(answer)===norm(q.ans)){div.querySelectorAll('.option').forEach(x=>{x.disabled=true;if(x===button)x.classList.add('ok')});f.textContent='✓ Correct! Great job!';f.className='feedback success';complete(i);}else{button.classList.add('no');f.textContent='Not quite. Try again! Schau dir die Regel oben noch einmal an.';f.className='feedback error';setTimeout(()=>button.classList.remove('no'),600)}}
function translationNorm(s){return norm(s).replace(/\b(is|are) not\b/g,(m,x)=>x==='is'?"isn't":"aren't").replace(/\bi am\b/g,"i'm").replace(/\bhe is\b/g,"he's").replace(/\bshe is\b/g,"she's").replace(/\bit is\b/g,"it's").replace(/\bwe are\b/g,"we're").replace(/\bthey are\b/g,"they're").replace(/\byou are\b/g,"you're").replace(/\bi'm not\b/g,'i am not');}
function setupTiles(div,q,i){let words=q.ans.replace(/[.!?]$/,'').split(' '),chosen=[],order=shuffle(words.map((w,j)=>({w,j})));let bank=div.querySelector('.chips'),ans=div.querySelector('.answer');function draw(){bank.innerHTML='';ans.innerHTML='';order.forEach(o=>{if(chosen.includes(o.j))return;let b=document.createElement('button');b.className='chip';b.textContent=o.w;b.onclick=()=>{chosen.push(o.j);draw()};bank.appendChild(b)});chosen.forEach(j=>{let b=document.createElement('button');b.className='chip';b.textContent=words[j];b.onclick=()=>{chosen=chosen.filter(x=>x!==j);draw()};ans.appendChild(b)})}draw();div.querySelector('.resetTiles').onclick=()=>{chosen=[];draw()};div.querySelector('.check').onclick=()=>{let value=chosen.map(j=>words[j]).join(' ');let f=div.querySelector('.feedback');if(norm(value)===norm(q.ans)){f.textContent='✓ Correct!';f.className='feedback success';div.querySelectorAll('button').forEach(b=>b.disabled=true);complete(i)}else{f.textContent='Noch nicht richtig. Tippe auf ein Wort im Satz, um es zurückzulegen.';f.className='feedback error'}};}
function checkText(i){let q=questions[i],div=$('#q'+i),input=div.querySelector('.field'),f=div.querySelector('.feedback'),v=norm(input.value);let valid=false;if(q.kind==='switch'||q.kind==='power')valid=v===norm(q.ans);if(q.kind==='translate')valid=translationNorm(input.value)===translationNorm(q.ans);if(q.kind==='short')valid=v===norm(q.ans);if(q.kind==='rewrite'){let forms=q.ans==='am not'?['am not']:q.ans==='isn’t'?["isn't",'is not']:["aren't",'are not'];valid=forms.some(form=>v===norm(`${q.sub} ${form} ${q.ending}`));}if(valid){f.textContent='✓ Correct! Well done!';f.className='feedback success';input.disabled=true;div.querySelector('.check').disabled=true;complete(i);}else{f.textContent='Almost! Check the sentence and try again. Tipp: Schau auf am / is / are und not.';f.className='feedback error';}}
menu();</script></body></html>
